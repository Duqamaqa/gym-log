<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Log">
  <meta name="description" content="Free, simple gym log for progressive overload. Your data stays on your phone.">
  <title>Gym Log</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Today</h1>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <button type="button" data-tab="workout"><span aria-hidden="true">🏋️</span>Today</button>
    <button type="button" data-tab="progress"><span aria-hidden="true">📈</span>Progress</button>
    <button type="button" data-tab="history"><span aria-hidden="true">🗓️</span>History</button>
    <button type="button" data-tab="settings"><span aria-hidden="true">⚙️</span>Settings</button>
  </nav>

  <dialog id="add-dialog" aria-labelledby="add-title">
    <form id="add-form" method="dialog">
      <h2 id="add-title">Add exercise</h2>
      <label for="add-name" class="label">Exercise name</label>
      <input id="add-name" name="name" type="text" list="exercise-names" autocomplete="off"
             autocapitalize="words" maxlength="60" placeholder="e.g. Bench press" required>
      <datalist id="exercise-names"></datalist>
      <div id="add-recent" class="chips"></div>
      <div class="row">
        <button type="button" class="btn ghost" id="add-cancel">Cancel</button>
        <button type="submit" class="btn primary">Add</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
